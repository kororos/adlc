# .github/workflows/e2e.yml: required checks e2e-web, e2e-android; e2e-ios (macOS, not required by default).
# STARTING POINT: the walking skeleton must prove each job end to end and adjust.
name: e2e
on:
  pull_request:
  push: { branches: [main] }
  # release.yml dispatches this on the release-please branch: its PR is opened with GITHUB_TOKEN,
  # which starts no workflows, so its required checks would otherwise never report.
  workflow_dispatch:
permissions: { contents: read, pull-requests: read, checks: read }   # pull-requests, checks: the gate's already-tested check on main
concurrency: { group: "e2e-${{ github.ref }}", cancel-in-progress: true }
env: { ADLC_RUN: "ci-${{ github.run_id }}" }

jobs:
  e2e-web:
    runs-on: ${{ fromJSON(vars.ADLC_TEST_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: gate
        run: bash .github/scripts/adlc-gate.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile && pnpm --filter app exec playwright install --with-deps chromium
      - if: steps.gate.outputs.run == 'true'
        run: docker network create adlc-web || true
      - if: steps.gate.outputs.run == 'true'
        run: eval "$(yq '.env.up' adlc.build.yaml)" && eval "$(yq '.env.seed' adlc.build.yaml)" && eval "$(yq '.env.start_build' adlc.build.yaml)"
      # Reach the web service from the job: connect this container (self-hosted) or use published ports (hosted).
      - if: steps.gate.outputs.run == 'true'
        run: docker network connect adlc-web "$(hostname)" 2>/dev/null || true
      - if: steps.gate.outputs.run == 'true'
        run: E2E_BASE_URL=http://web pnpm --filter app exec playwright test --grep @smoke
      - if: failure() && steps.gate.outputs.run == 'true'
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: apps/app/playwright-report, retention-days: 7 }
      - if: always() && steps.gate.outputs.run == 'true'
        run: eval "$(yq '.env.down' adlc.build.yaml)"

  e2e-android:
    # GitHub-hosted (default) or your host with `adlc up <slug> --ci-kvm on` and the repository
    # variable ADLC_ANDROID_RUNS_ON='["self-hosted","adlc-kvm"]'. Same check name either way.
    runs-on: ${{ fromJSON(vars.ADLC_ANDROID_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: gate                     # globs from adlc.yaml ci.e2e_android_paths (`*` also matches `/`)
        run: bash .github/scripts/adlc-gate.sh 'apps/app/*' 'apps/api/*' 'packages/*'
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - if: steps.gate.outputs.run == 'true' && runner.environment == 'self-hosted'
        uses: android-actions/setup-android@v3          # hosted images already have the SDK
        # only adb: the default list includes `tools`, gone from the SDK repository (sdkmanager fails);
        # Gradle installs the platform, build-tools and NDK it needs
        with: { packages: platform-tools }
      - if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile && curl -Ls https://get.maestro.mobile.dev | bash
      # x86_64 only: the emulator's ABI (all four ABIs take far longer and can fill a hosted runner's disk).
      # Self-hosted: stop the Gradle daemon afterwards, so its memory is free before the emulator starts.
      - if: steps.gate.outputs.run == 'true'
        run: |
          pnpm --filter app exec expo prebuild --platform android --no-install
          cd apps/app/android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then ./gradlew --stop >/dev/null 2>&1 || true; fi
      # Self-hosted: the emulator container runs in the CI engine (it has /dev/kvm), started only after the
      # build: on a shared host both at once can run out of memory. The CI engine is wiped before every job,
      # so each job gets a fresh emulator (the image stays cached).
      - if: steps.gate.outputs.run == 'true' && runner.environment == 'self-hosted'
        run: |
          docker network create adlc-web 2>/dev/null || true
          docker network connect adlc-web "$(hostname)" 2>/dev/null || true
          docker compose -p adlc-emulator -f deploy/compose.emulator.yml up -d
      # adb connect only reports a refused connection as text and the emulator's adb port opens late:
      # reconnect on every check. A cold boot on nested virtualisation can take several minutes.
      - if: steps.gate.outputs.run == 'true' && runner.environment == 'self-hosted'
        run: |
          for i in $(seq 1 180); do
            adb connect emulator:5555 >/dev/null 2>&1 || true
            [ "$(adb -s emulator:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break
            [ "$i" = 180 ] && { echo "::error::the emulator didn't boot within 15 minutes"; exit 3; }
            sleep 5
          done
          adb -s emulator:5555 install -r apps/app/android/app/build/outputs/apk/release/app-release.apk
          ~/.maestro/bin/maestro --device emulator:5555 test apps/app/e2e/flows --include-tags smoke
      # Before the emulator is removed: KVM, memory, the emulator's own log; Maestro's screenshots as artifact.
      # Diagnostics must never hang the job: every call is bounded, and the step and the artifact have
      # their own short limits. No emulator (an earlier step failed): say so and stop.
      - if: failure() && steps.gate.outputs.run == 'true' && runner.environment == 'self-hosted'
        timeout-minutes: 5
        run: |
          c=$(timeout -k 5 30 docker compose -p adlc-emulator -f deploy/compose.emulator.yml ps -q emulator 2>/dev/null) || true
          [ -n "$c" ] || { echo "emulator not started"; exit 0; }
          timeout -k 5 60 docker exec "$c" sh -c 'ls -l /dev/kvm; free -m; for f in /home/androidusr/logs/*device*; do echo "== $f"; tail -n 40 "$f"; done' || true
          timeout -k 5 30 docker logs --tail 60 "$c" 2>&1 || true
      - if: failure() && steps.gate.outputs.run == 'true' && runner.environment == 'self-hosted'
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with: { name: maestro-android, path: ~/.maestro/tests, retention-days: 7, if-no-files-found: ignore }
      - if: always() && steps.gate.outputs.run == 'true' && runner.environment == 'self-hosted'
        timeout-minutes: 5
        run: docker compose -p adlc-emulator -f deploy/compose.emulator.yml down -v || true
      - if: steps.gate.outputs.run == 'true' && runner.environment != 'self-hosted'
        run: sudo udevadm control --reload-rules || true
      - if: steps.gate.outputs.run == 'true' && runner.environment != 'self-hosted'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: adb install -r apps/app/android/app/build/outputs/apk/release/app-release.apk && $HOME/.maestro/bin/maestro test apps/app/e2e/flows --include-tags smoke

  e2e-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    if: github.event_name == 'push'   # macOS minutes are ~10× Linux: main only by default
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: gate
        run: bash .github/scripts/adlc-gate.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile && curl -Ls https://get.maestro.mobile.dev | bash
      - if: steps.gate.outputs.run == 'true'
        run: pnpm --filter app exec expo prebuild --platform ios && pnpm --filter app exec expo run:ios --configuration Release --no-install
      - if: steps.gate.outputs.run == 'true'
        run: ~/.maestro/bin/maestro test apps/app/e2e/flows --include-tags smoke
