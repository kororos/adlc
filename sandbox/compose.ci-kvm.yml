# Added by `adlc up` when ADLC_CI_KVM=1 (adlc up --ci-kvm on) and /dev/kvm exists on the host.
# CI jobs on the `adlc-kvm` label can start the Android emulator container in ci-docker
# (e2e-android on your host instead of GitHub-hosted runners).
services:
  ci-docker:
    devices:
      - /dev/kvm:/dev/kvm
  ci:
    environment:
      ADLC_CI_KVM: "1"
